<!doctype html>
<html lang="th" data-mode="<!--DR:MODE-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title><!--DR:TITLE--></title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg-primary: #fff;
    --bg-secondary: #fff;
    --bg-tertiary: #F3F4F6;
    --border: #E5E7EB;
    --text-primary: #111827;
    --text-secondary: #6B7280;
    --accent: #6366F1;
    --font: Inter, "IBM Plex Sans Thai", system-ui, "Leelawadee UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font); font-size: 14px; line-height: 1.5; }

  /* ---------- top bar ---------- */
  .dr-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
  #dr-title { margin: 0 auto 0 0; font-weight: 700; font-size: 14px; line-height: 1.4; color: var(--text-primary); overflow-wrap: anywhere; }
  .dr-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dr-seg { display: inline-flex; background: var(--bg-tertiary); border-radius: 999px; padding: 3px; gap: 2px; }
  .dr-seg button { border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
  .dr-seg button.on { background: var(--bg-secondary); color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .dr-btn { border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .dr-btn:hover { border-color: var(--accent); }
  .dr-btn.on { border-color: var(--accent); color: var(--accent); }
  .dr-legend { flex-basis: 100%; display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
  .dr-legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; }
  .dr-legend .more::before { background: transparent; border: 1.5px dashed var(--text-secondary); width: 7px; height: 7px; }
  .dr-legend .plan::before { background: transparent; border: 1.5px dashed var(--text-secondary); width: 16px; height: 9px; border-radius: 999px; }
  .dr-status { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
  .dr-status.busy { color: #0369A1; }
  .dr-offline { font-size: 11.5px; font-weight: 700; color: #991B1B; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 999px; padding: 1px 9px; }
  .dr-chip { border: 1px solid #FDE68A; background: #FFFBEB; color: #92400E; border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .dr-chip:hover, .dr-chip[aria-expanded="true"] { border-color: #F59E0B; }
  .dr-queue { flex-basis: 100%; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .dr-queue-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; color: #78350F; }
  .dr-queue-h span { font-size: 12px; color: #92400E; }
  .dr-queue ul { margin: 6px 0 10px; padding-left: 18px; color: #374151; font-size: 12.5px; }
  .dr-queue li span { color: #6B7280; }
  .dr-queue-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .dr-copy { display: block; width: 100%; margin-top: 10px; padding: 6px 8px; border: 1px solid #FDE68A; border-radius: 8px; font: 12px/1.45 ui-monospace, Consolas, monospace; color: #111827; resize: vertical; }
  .dr-queue-msg { margin: 8px 0 0; font-size: 12px; color: #92400E; }
  .dr-queue-msg:empty { display: none; }

  /* ---------- map and panel ---------- */
  .dr-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr); }
  #dr-canvas { position: relative; background-color: #fff; background-image: radial-gradient(#E7E5E4 1px, transparent 1.3px); background-size: 22px 22px; overflow: hidden; }
  #dr-canvas svg { width: 100%; height: 100%; display: block; cursor: grab; font-family: var(--font); }
  #dr-canvas svg:active { cursor: grabbing; }
  .dr-hint { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: #6B7280; background: rgba(255,255,255,.92); border: 1px solid #E5E7EB; border-radius: 999px; padding: 3px 10px; pointer-events: none; }
  .dr-error { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 6; padding: 14px 16px; border-radius: 12px; background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; font-size: 14px; }
  .dr-error p { margin: 4px 0 0; font-size: 13px; overflow-wrap: anywhere; }

  /* ---------- the direction menu: beside a node on the map, or under the buttons in the panel ---------- */
  .dr-menu { position: absolute; z-index: 5; width: 248px; max-width: calc(100% - 16px); background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 30px rgba(17,24,39,.14); padding: 8px; font-size: 13px; }
  .dr-menu.in-panel { position: static; width: auto; max-width: none; flex-basis: 100%; box-shadow: none; }
  .dr-menu-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px; }
  .dr-menu-t { margin-right: auto; font-size: 12.5px; font-weight: 700; color: var(--text-primary); overflow-wrap: anywhere; }
  .dr-menu-x { border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .dr-menu-x:hover { background: var(--bg-tertiary); }
  .dr-menu-list { display: flex; flex-direction: column; gap: 2px; }
  .dr-menu-list button { border: 0; background: transparent; color: #1F2937; font: inherit; font-size: 13px; text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .dr-menu-list button:hover, .dr-menu-list button:focus-visible, .dr-menu-list button.on { background: #EEF2FF; color: #3730A3; }
  .dr-menu-list button:disabled { opacity: .5; cursor: default; }
  .dr-ask { display: flex; gap: 6px; margin-top: 6px; }
  .dr-ask input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; color: var(--text-primary); }
  .dr-ask input:focus { outline: 2px solid #C7D2FE; border-color: var(--accent); }
  .dr-menu-msg { margin: 6px 4px 0; font-size: 12px; color: #92400E; }
  .dr-menu-msg:empty { display: none; }
  #dr-panel { background: #fff; border-left: 1px solid #E5E7EB; overflow: auto; padding: 18px 20px; color: #1F2937; font-family: var(--font); font-size: 13.5px; line-height: 1.55; }
  @media (max-width: 900px) {
    html, body { height: auto; }
    .dr-body { flex: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
    #dr-canvas { height: 540px; }
    #dr-panel { border-left: 0; border-top: 1px solid var(--border); overflow: visible; }
  }

  .km-measure.d0, .km-node.d0 .lbl { font-size: 16px; font-weight: 700; }
  .km-measure.d1, .km-node.d1 .lbl { font-size: 14px; font-weight: 700; }
  .km-measure.d2, .km-node.d2 .lbl { font-size: 13px; font-weight: 500; }
  .km-node { cursor: pointer; transition: opacity .25s; }
  .km-node .km-pill { fill: #fff; stroke: var(--c); stroke-opacity: .45; stroke-width: 1.5; }
  .km-node.d0 .km-pill { fill: #111827; stroke: #111827; stroke-opacity: 1; }
  .km-node.d1 .km-pill { fill: var(--c); stroke: var(--c); stroke-opacity: 1; }
  .km-node .lbl { fill: #111827; dominant-baseline: central; }
  .km-node.d0 .lbl, .km-node.d1 .lbl { fill: #fff; }
  .km-node .zi { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .km-node:hover .km-pill { stroke-opacity: 1; }
  .km-node.sel .km-pill { stroke: #6366F1; stroke-opacity: 1; stroke-width: 3; }
  .km-node.d0.sel .km-pill, .km-node.d1.sel .km-pill { stroke: #C7D2FE; }
  .km-node.dim { opacity: .25; }
  .km-node.loading .lbl { animation: kmPulse 1s ease-in-out infinite; }
  .km-node.fresh .km-pill { animation: kmGlow 1.6s ease-out 1; }
  @keyframes kmPulse { 50% { opacity: .35; } }
  @keyframes kmGlow { 0% { stroke-width: 7; stroke-opacity: 1; } 100% { stroke-width: 1.5; stroke-opacity: .45; } }
  .km-cnt { fill: var(--c); }
  .km-node.d0 .km-cnt, .km-node.d1 .km-cnt { fill: rgba(255,255,255,.25); }
  .km-cnt.more { fill: #fff; stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 2 2; }
  .km-cnt-t { font-size: 10.5px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .km-cnt-t.more { fill: var(--c); font-size: 13px; }
  .km-tag { font-size: 10px; font-weight: 700; }
  .km-tag.new { fill: #0EA5E9; }
  .km-link { fill: none; stroke: var(--c); stroke-opacity: .4; transition: stroke-opacity .25s; }
  .km-link.l1 { stroke-width: 3.2; }
  .km-link.l2 { stroke-width: 2.2; }
  .km-link.l3 { stroke-width: 1.6; }
  .km-link.on { stroke-opacity: .95; }
  .km-link.dim { stroke-opacity: .08; }
  .km-node.planned .km-pill { stroke-dasharray: 5 4; stroke-opacity: .85; }
  .km-node.planned .lbl { fill: #6B7280; }
  .km-node .km-tag { dominant-baseline: central; }
  .km-tag.check { fill: #B45309; }
  .km-tag.busy { fill: #0369A1; }
  .km-node .gi { fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .km-spin circle { fill: none; stroke: var(--c); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 30 14; transform-box: fill-box; transform-origin: center; animation: kpSpin .8s linear infinite; }
  .km-halo { fill: #FDE68A; fill-opacity: .55; stroke: #F59E0B; stroke-width: 1.5; }

  .kp-kind { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--c); }
  .kp-kind::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #dr-panel h3 { margin: 4px 0 2px; font-size: 19px; font-weight: 700; color: #111827; }
  .kp-path { font-size: 11.5px; color: #6B7280; margin-bottom: 10px; }
  .kp-sum { margin: 0 0 12px; color: #374151; font-size: 14px; }
  .kp-meta { font-size: 12px; color: #6B7280; background: #F8FAFC; border: 1px solid #EEF2F7; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }
  .kp-sec { margin: 14px 0 6px; font-size: 12.5px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 6px; }
  .kp-ul { margin: 0; padding-left: 18px; color: #374151; }
  .kp-ul li { margin: 3px 0; }
  .kp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .kp-chip { border: 1px solid #E5E7EB; background: #fff; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; font-weight: 600; color: #374151; cursor: pointer; }
  .kp-chip:hover { border-color: #6366F1; color: #4338CA; }
  .kp-src { display: flex; flex-direction: column; gap: 5px; }
  .kp-src div { font-size: 12.5px; color: #374151; }
  .kp-src small { color: #6B7280; margin-left: 6px; }
  .kp-src a { color: #1D4ED8; text-decoration: none; }
  .kp-src a:hover { text-decoration: underline; }
  .kp-src > div { scroll-margin-top: 56px; border-radius: 6px; }
  .kp-src > div:target { background: #FEF9C3; }
  .kp-n { color: #6B7280; font-weight: 600; }
  .kp-cite { font-size: 11.5px; font-weight: 700; color: #4F46E5; text-decoration: none; }
  .kp-cite:hover { text-decoration: underline; }
  .kp-ul li.key { font-weight: 600; color: #111827; }
  .kp-tag { display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 1.5; padding: 0 6px; border-radius: 999px; border: 1px solid #E5E7EB; background: #F9FAFB; color: #4B5563; vertical-align: 1px; }
  .kp-tag.t-opinion { background: #F5F3FF; border-color: #DDD6FE; color: #6D28D9; }
  .kp-tag.t-estimate { background: #F0F9FF; border-color: #BAE6FD; color: #0369A1; }
  .kp-tag.single, .kp-tag.old { background: #FEF3C7; border-color: #FDE68A; color: #92400E; }
  .kp-foryou { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: #EEF2FF; border: 1px solid #C7D2FE; color: #312E81; }
  .kp-foryou-h { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .kp-foryou p { margin: 0; font-size: 13.5px; }
  .kp-reason { margin: 0; font-size: 13px; color: #374151; }
  .kp-read { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -18px -20px 12px; padding: 10px 20px; background: #FFFBEB; border-bottom: 1px solid #FDE68A; }
  .kp-read-n { margin-right: auto; font-size: 12.5px; font-weight: 700; color: #92400E; }
  .kp-actions .kp-note, .kp-actions .kp-loading { flex-basis: 100%; margin-top: 0; }
  .kp-conf { font-size: 11px; font-weight: 600; padding: 0 8px; border-radius: 999px; background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
  .kp-conf.mid { background: #FFFBEB; color: #92400E; border-color: #FDE68A; }
  .kp-conf.low { background: #FEF2F2; color: #991B1B; border-color: #FECACA; }
  .kp-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid #F1F5F9; }
  .kp-btn { border: 1px solid #E5E7EB; background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12.5px; font-weight: 600; color: #374151; cursor: pointer; }
  .kp-btn.primary { background: #111827; color: #fff; border-color: #111827; }
  .kp-btn:hover { border-color: #6366F1; }
  .kp-btn:disabled { opacity: .45; cursor: default; }
  .kp-btn:disabled:hover { border-color: #E5E7EB; }
  .kp-btn.primary:disabled:hover { border-color: #111827; }
  .kp-note { font-size: 12px; color: #0C4A6E; background: #F0F9FF; border: 1px solid #BAE6FD; border-radius: 10px; padding: 8px 10px; margin-top: 12px; }
  .kp-loading { display: flex; align-items: center; gap: 8px; color: #0369A1; font-weight: 600; margin-top: 8px; }
  .kp-loading::before { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #BAE6FD; border-top-color: #0284C7; animation: kpSpin .8s linear infinite; }
  @keyframes kpSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="dr-bar">
  <h1 id="dr-title"></h1>
  <div class="dr-tools" id="dr-tools">
    <span class="dr-status" id="dr-status"></span>
    <span class="dr-offline" id="dr-offline" title="ติดต่อเซิร์ฟเวอร์ในเครื่องไม่ได้ คำขอใหม่จะเก็บไว้ในคิวรอขุด" hidden>ออฟไลน์</span>
    <button type="button" class="dr-chip" id="dr-queue-chip" aria-controls="dr-queue" aria-expanded="false" hidden></button>
    <div class="dr-seg" id="dr-layout" role="group" aria-label="เลย์เอาต์">
      <button type="button" class="on" data-layout="both" aria-pressed="true">กระจายสองฝั่ง</button>
      <button type="button" data-layout="right" aria-pressed="false">กางไปทางขวา</button>
    </div>
    <button type="button" class="dr-btn on" id="dr-focus" aria-pressed="true" title="จางกิ่งที่ไม่เกี่ยวกับโหนดที่เลือก">โฟกัส</button>
    <button type="button" class="dr-btn" id="dr-fit">พอดีจอ</button>
    <button type="button" class="dr-btn" id="dr-zoom-in" aria-label="ซูมเข้า">+</button>
    <button type="button" class="dr-btn" id="dr-zoom-out" aria-label="ซูมออก">−</button>
  </div>
  <div class="dr-queue" id="dr-queue" hidden></div>
  <div class="dr-legend" id="dr-legend"></div>
</header>
<main class="dr-body">
  <div id="dr-canvas"><svg id="dr-svg"></svg></div>
  <aside id="dr-panel"></aside>
</main>

</body>
</html>
